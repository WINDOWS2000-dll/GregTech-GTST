/*
 * Add your dependencies here. Supported configurations (Unimined):
 *  - api / implementation / compileOnly / compileOnlyApi / runtimeOnly / annotationProcessor:
 *       standard Gradle java-library configurations, for dependencies that are already MCP-named
 *       (dev jars, plain libraries - no deobfuscation needed)
 *  - modApi / modImplementation / modCompileOnly / modRuntimeOnly:
 *       like the above, but for Forge mods whose published jars are SRG-obfuscated
 *       (typically CurseForge/Modrinth player-facing jars). Unimined remaps them at resolve time.
 *  - modDevImplementation: like modImplementation, but without refmapping
 *  - shadow("g:n:v"): bundled and relocated into the shadow jar (requires enable_shadow=true)
 *  - contain("g:n:v"): bundled into the final jar unmodified (jar-in-jar)
 *
 * CurseMaven coordinates: 'curse.maven:project_slug-project_id:file_id'
 * Full documentation: https://cursemaven.com/
 */
dependencies {
    // Published dependencies

    api("java3d:vecmath:1.5.2")

    compileOnly("org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209") { transitive = false }

    // CurseForge-published jars are SRG-obfuscated and must use modApi (not api) so Unimined
    // remaps them to MCP names at resolve time - using plain api() left func_188617_f() etc.
    // unremapped, which doesn't satisfy IBakedModel's MCP-named getOverrides() abstract method.
    modApi("curse.maven:codechicken-lib-cre-1328922:8553938")
    // ModularUI/GroovyScript ship "-dev" classified (already MCP-named) jars, so remapping itself
    // is a no-op - but they are genuine Forge mods (their own coremods/mixins), and Unimined's
    // own modDevImplementation (not plain api) is what feeds Cleanroom's mod-discovery/
    // crl.dev.extrapath handling for dev-namespace mod jars (see ModsProvider.kt getClasspath()).
    modApi("com.cleanroommc:modularui:3.1.5") { transitive = false }
    modApi("com.cleanroommc:groovyscript:1.4.3") { transitive = false }
    // Key Binding Patch v1.3.3.3, needed by Inventory BogoSorter v1.5.0+. CurseForge-published,
    // SRG-obfuscated - must be modApi (same class of bug as the CodeChickenLib CRE fix above).
    modApi("curse.maven:key-binding-patch-928895:5951859")
    compileOnly("CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.700")
    // AE2 Unofficial Extended Life - dev-namespace jar (own maven, already MCP-named), same
    // reasoning as ModularUI/GroovyScript above.
    modApi("appeng:ae2-uel:v0.56.7")

    modApi("curse.maven:fugue-1005815:8878028") { transitive = false }
    modApi("curse.maven:ctm-267602:2915363") // CTM 1.0.2.31

    shadow("org.jgrapht:jgrapht-core:1.4.0")
    // shadow {} feeds compileClasspath but not runtimeClasspath (by design - in a packaged build
    // the relocated classes bundled into shadowJar serve that role at runtime). runClient runs
    // straight from build/classes/java/main though, never touching the shadowJar, so PipeNet code
    // using org.jgrapht.* would throw NoClassDefFoundError at runtime in dev mode without this.
    // A plain runtimeOnly duplicate (rather than wiring sourceSets.main.runtimeClasspath to
    // configurations.shadow directly) avoids "Cannot mutate the dependencies of configuration
    // ':clientExtra' after ... ':minecraft' was resolved" - referencing configurations.shadow
    // anywhere in build.gradle's configuration phase (sourceSets block, afterEvaluate, even a
    // deferred doFirst) reliably triggers that error; a completely independent, standard
    // runtimeOnly dependency declaration does not.
    runtimeOnly("org.jgrapht:jgrapht-core:1.4.0")

    // Non-published dependencies
    // Change any to modRuntimeOnly (add) to test them in-game. These are CurseForge-published
    // (SRG-obfuscated) jars like the rest, so modCompileOnly (not plain compileOnly) is required
    // even though they're compile-only here - our own source resolves their MCP-named API surface
    // against them, same class of bug as the CodeChickenLib CRE / JEI fixes above.
    modCompileOnly("curse.maven:journeymap-32274:5172461") // Journeymap 5.7.1p3
    modCompileOnly("curse.maven:voxelmap-225179:3029445") // VoxelMap 1.9.28
    modCompileOnly("curse.maven:xaeros-263420:5394758") // Xaero's Minimap 24.2.0
    modCompileOnly("curse.maven:ftb-library-legacy-forge-237167:2985811") // FTB Library 5.4.7.2
    modRuntimeOnly("curse.maven:ftb-library-legacy-forge-237167:2985811")
    modCompileOnly("curse.maven:ftb-utilities-forge-237102:3157548") // FTB Utilities 5.4.1.131
    modRuntimeOnly("curse.maven:ftb-utilities-forge-237102:3157548")
    modCompileOnly("curse.maven:opencomputers-223008:5274236") // OpenComputers 1.8.5+179e1c3
    modCompileOnly("curse.maven:hwyla-253449:2568751") // HWYLA 1.8.26-B41
    modCompileOnly("curse.maven:baubles-227083:2518667") // Baubles 1.5.2
    modCompileOnly("curse.maven:forestry-59751:2684780") // Forestry 5.8.2.387
    modCompileOnly("curse.maven:chisel-235279:2915375") // Chisel 1.0.2.45
    modCompileOnly("curse.maven:littletiles-257818:4750222") // LittleTiles 1.5.82-1.12.2
    modCompileOnly("curse.maven:creativecore-257814:4722163") // Creative Core 1.10.71

    // @WrapOperation / Local sugar used across mixins; bundled at runtime by MixinBooter, only needs to resolve at compile time.
    compileOnly("io.github.llamalad7:mixinextras-common:0.4.1")

    // Note: Alfheim / Nothirium / Vintagium / OptiFine / IE / EnderIO / etc. soft integrations are NOT declared
    // as Maven dependencies - this project maintains hand-written compile-only API stubs for them under src/api/java
    // (wired into the main source set in build.gradle), so no external dependency is needed here.

    // Common dev-env mods (JEI / TOP), mirroring the old includeCommonDevEnvMods behavior
    if (!(mod_id.equals('jei'))) {
        // JEI's published jar is SRG-obfuscated like other CurseForge/Maven Forge mods -
        // modImplementation (Unimined's own built-in, pre-wired mod configuration) is required
        // instead of plain implementation, otherwise FML's ProxyInjector NPEs on JEI's own
        // unremapped @SidedProxy field (confirmed via runClient: "mezz.jei.JustEnoughItems" / "proxy").
        modImplementation 'mezz.jei:jei_1.12.2:4.16.1.302'
    }
    if (!(mod_id.equals('theoneprobe'))) {
        modApi("curse.maven:top-245211:2667280") // TOP 1.4.28
    }

    // Mods with Soft compat but which have no need to be in code, such as isModLoaded() checks and getModItem() recipes.
    // Uncomment any of these to test them in-game.

    // modRuntimeOnly("curse.maven:beebetteratbees-244516:2627215") // BeeBetterAtBees 2.0.3 (recommended to enable when testing Forestry compat)
    // modRuntimeOnly("curse.maven:jei-bees-248370:2490058") // JEIBees 0.9.0.5 (recommended to enable when testing Forestry compat)
    // modRuntimeOnly("curse.maven:binnies-mods-223525:2916129") // Binnie 2.5.1.203
    // modRuntimeOnly("curse.maven:magic-bees-65764:2855061") // Magic Bees 3.2.25
    // modRuntimeOnly("curse.maven:gendustry-70492:2516215") // Gendustry 1.6.5.8
    // modRuntimeOnly("curse.maven:bdlib-70496:2518031") // BdLib 1.14.3.12
}
