# Gradle Properties
org.gradle.logging.stacktrace = all
org.gradle.jvmargs = -Xmx3G

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = true

# Shadow
enable_shadow = true

enable_lwjglx = false

# Mod Information
mod_version = 2.9.0-1.2.6-GTST-RecipeReworkPR#2755
root_package = gregtech
mod_id = gregtech
mod_name = GregTech

# Mod Metadata (Optional)
mod_description =
mod_url = https://www.curseforge.com/minecraft/mc-mods/gregtech-ce-unofficial
mod_update_json =
mod_authors = serenibyss,TechLord22,KilaBash,Archengius,Exidex,BloodAsp,Muramasa,GregoriusT
mod_credits = GregoriusT for making GregTech and textures, the GT5u authors and maintainers for providing the original code, and the community.
mod_logo_path =
mod_issue_tracker =

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
enable_foundation_debug = false

# Maven Publishing (handled via bespoke customMavenPublishUrl block in build.gradle, see below)
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Access Transformers
# AT file must use MCP names; Unimined remaps it to SRG names when building.
# Default location resolved by the buildscript: src/main/resources/${mod_id}_at.cfg
use_access_transformer = true

# Coremods
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = mixins.GregTechMixinLoadingPlugin

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5

minecraft_version = 1.12.2

# Publish to a custom maven location (same as the pre-migration GTNH buildscript behavior)
customMavenPublishUrl = https://maven.gtceu.com
mavenArtifactGroup = gregtech

# CurseForge / Modrinth project IDs - set via CURSEFORGE_PROJECT_ID / MODRINTH_PROJECT_ID env vars or here
curseForgeProjectId =
modrinthProjectId =
curseForgeRelations =
modrinthRelations =
releaseType = beta
versionDisplayFormat = $MOD_NAME: $VERSION
clientEnvironment = true
serverEnvironment = true
