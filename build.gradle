import com.modrinth.minotaur.dependencies.ModDependency
import com.modrinth.minotaur.dependencies.VersionDependency
import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent
import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'xyz.wagyourtail.unimined' version '1.4.43-kappa'
    id 'net.kyori.blossom' version '2.2.0'
    id 'com.diffplug.spotless' version '6.13.0' apply false
    id 'com.palantir.git-version' version '3.0.0' apply false
    id 'net.darkhax.curseforgegradle' version '1.1.24' apply false
    id 'com.modrinth.minotaur' version '2.8.7' apply false
}

ext {
    //noinspection GroovyAssignabilityCheck
    access_transformer_locations = "${mod_id}_at.cfg"
}

// Try to gather mod version from git tags if version is not manually specified
if (!mod_version) {
    try {
        mod_version = gitVersion()
    } catch (Exception ignored) {
        mod_version = 'NO-GIT-TAG-SET'
    }
}

// Preserve the pre-migration jar naming scheme: <modid>-<mcversion>-<modversion>.jar
version = "${minecraft_version}-${mod_version}"
group = root_package

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    if (generate_sources_jar.toBoolean()) {
        withSourcesJar()
    }
    if (generate_javadocs_jar.toBoolean()) {
        withJavadocJar()
    }
}

configurations {
    contain
    implementation.extendsFrom(contain)
    modApi
    modCompileOnly
    modRuntimeOnly

    // exclude GNU trove, FastUtil is superior and still updated
    compileOnly {
        exclude group: "net.sf.trove4j", module: "trove4j"
        // exclude javax.annotation from findbugs, jetbrains annotations are superior
        exclude group: "com.google.code.findbugs", module: "jsr305"
        // exclude scala as we don't use it for anything and causes import confusion
        exclude group: "org.scala-lang"
        exclude group: "org.scala-lang.modules"
        exclude group: "org.scala-lang.plugins"
    }
}

def remapTaskName = enable_shadow.toBoolean() ? "remapShadowJar" : "remapJar"

//noinspection GroovyAssignabilityCheck
unimined.minecraft {
    version minecraft_version

    mappings {
        mcp("stable", "39-1.12")
    }

    cleanroom {
        if (use_access_transformer.toBoolean()) {
            accessTransformer "${rootProject.projectDir}/src/main/resources/${access_transformer_locations}"
        }
        loader "0.6.13-alpha"

        runs.all {
            args += ['--username', minecraft_username]

            // enable JLine Terminal since idea_rt.jar is no longer added to the classpath
            jvmArgs += ['-ea:' + root_package, '-Dterminal.jline=true']
            jvmArgs += [
                    '-Dmixin.hotSwap=true',
                    '-Dmixin.checks.interfaces=true',
                    '-Dmixin.debug.export=true'
            ]

            def extraArgs = extra_jvm_args
            if (extraArgs != null && !extraArgs.trim().isEmpty()) {
                jvmArgs += extraArgs.split { "\\s+" }.toList()
            }
            if (enable_foundation_debug.toBoolean()) {
                systemProperty("foundation.dump", "true")
                systemProperty("foundation.verbose", "true")
            }
            if (is_coremod.toBoolean()) {
                systemProperty("fml.coreMods.load", "${root_package}.${coremod_plugin_class_name}")
            }
            systemProperty("crl.dev.mixin.0", "mixins.${mod_id}.forge.json")
            systemProperty("crl.dev.mixin.1", "mixins.${mod_id}.minecraft.json")
            return
        }
    }

    defaultRemapJar = false

    String jarTaskName = enable_shadow.toBoolean() ? "shadowJar" : "jar"

    remap(tasks.named(jarTaskName).get()) {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
    }

    mods {
        remap(configurations.modApi)
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

def mixinReobfSrgFile = layout.buildDirectory.file("mixinMappings/mcp-to-searge.srg")
exportMappings {
    export {
        setSourceNamespace("mcp")
        setTargetNamespaces(["searge"])
        setType("SRG")
        location = mixinReobfSrgFile.get().asFile
    }
}

dependencies {
    if (enable_junit_testing.toBoolean()) {
        testImplementation 'org.hamcrest:hamcrest:2.2'
        testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    compileOnlyApi 'org.jetbrains:annotations:24.1.0'
    annotationProcessor 'org.jetbrains:annotations:24.1.0'

    compileOnly('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') { transitive = false }
    testCompileOnly('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') { transitive = false }

    annotationProcessor 'org.ow2.asm:asm-tree:9.10.1'
    annotationProcessor 'org.ow2.asm:asm-util:9.10.1'
    annotationProcessor 'org.ow2.asm:asm-commons:9.10.1'
    annotationProcessor 'org.ow2.asm:asm-analysis:9.10.1'
    annotationProcessor 'com.google.guava:guava:30.0-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    compileOnly('zone.rong:mixinbooter:10.6') { transitive = false }
    annotationProcessor('zone.rong:mixinbooter:10.6') { transitive = false }

    api 'com.google.code.gson:gson:2.8.9'
}

configurations.all {
    resolutionStrategy {
        force 'com.google.code.gson:gson:2.8.9'
    }

    exclude group: 'org.ow2.asm', module: 'asm-debug-all'
    exclude group: 'curse.maven', module: 'gregtechceu-557242'
    exclude group: 'curse.maven', module: 'gregtech-ce-unofficial-557242'
    exclude group: 'curse.maven', module: 'codechicken-lib-1-8-242818'
    exclude group: 'curse.maven', module: 'industrial-craft-242638'
}

repositories {
    maven {
        name = 'CleanroomMaven'
        url = 'https://maven.cleanroommc.com'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'BlameJaredMaven'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'GTCEuMaven'
        url = 'https://maven.gtceu.com'
    }
    maven {
        name = 'GTNHMaven'
        url = 'https://nexus.gtnewhorizons.com/repository/public/'
    }
    mavenCentral()
    mavenLocal() // Must be last for caching to work
}

apply from: 'dependencies.gradle'

def compileStubExcludes = [
        'net/optifine/**', 'com/creativemd/creativecore/client/mods/optifine/**',
        'dev/redstudio/alfheim/**', 'meldexun/nothirium/**', 'me/jellysquid/mods/sodium/**',
        'cofh/**', 'buildcraft/**', 'crazypants/**', 'mods/railcraft/**', 'mrtjp/**',
        'blusunrize/**', 'com/enderio/**', 'io/github/drmanganese/**'
]

sourceSets {
    main {
        java {
            srcDirs += ['src/api/java']
        }
        blossom {
            javaSources {
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('mod_version', mod_version)
                property('package', root_package)
            }
        }
        compileClasspath += configurations.modApi + configurations.modCompileOnly
        runtimeClasspath += configurations.modApi + configurations.modRuntimeOnly
    }
}

// Spotless (independent of the Minecraft toolchain, kept from the pre-migration buildscript)
apply plugin: 'com.diffplug.spotless'
spotless {
    encoding 'UTF-8'

    format 'misc', {
        target '.gitignore'

        trimTrailingWhitespace()
        indentWithSpaces(4)
        endWithNewline()
    }
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'

        toggleOffOn()
        importOrderFile(project.file('spotless.importorder'))
        removeUnusedImports()
        endWithNewline()
        //noinspection GroovyAssignabilityCheck
        eclipse('4.19.0').configFile(project.file('spotless.eclipseformat.xml'))
    }
}

if (project.file('.git/HEAD').isFile() || project.file('.git').isFile()) {
    apply plugin: 'com.palantir.git-version'
}

processResources {
    inputs.property 'version', mod_version
    inputs.property 'mcversion', minecraft_version

    exclude('spotless.importorder')
    exclude('spotless.eclipseformat.xml')

    filesMatching('mcmod.info') { fcd ->
        fcd.expand(
                'version': mod_version,
                'mcversion': minecraft_version,
                'modid': mod_id,
                'modname': mod_name
        )
    }

    rename "(${access_transformer_locations})", 'META-INF/$1'
}

jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude(compileStubExcludes)
    if (project.configurations.contain.size() > 0) {
        into('/') {
            from project.configurations.contain
        }
    }
    doFirst {
        manifest {
            def attribute_map = [:]
            attribute_map['ModType'] = "CRL"
            if (project.configurations.contain.size() > 0) {
                attribute_map['ContainedDeps'] = project.configurations.contain.collect { it.name }.join(' ')
                attribute_map['NonModDeps'] = true
            }
            if (is_coremod.toBoolean()) {
                attribute_map['FMLCorePlugin'] = "${root_package}.${coremod_plugin_class_name}"
                if (coremod_includes_mod.toBoolean()) {
                    attribute_map['FMLCorePluginContainsFMLMod'] = true
                }
            }
            if (use_access_transformer.toBoolean()) {
                attribute_map['FMLAT'] = access_transformer_locations
            }
            attribute_map['ForceLoadAsMod'] = true
            attributes(attribute_map)
        }
    }
    finalizedBy(tasks.named(remapTaskName).get())
}

shadowJar {
    //noinspection GroovyAssignabilityCheck,GroovyAccessibility
    configurations = [project.configurations.shadow]
    archiveClassifier = "dev"
    exclude(compileStubExcludes)
    if (project.configurations.contain.size() > 0) {
        into('/') {
            from project.configurations.contain
        }
    }
    relocate('org.jgrapht', "${root_package}.shadow.org.jgrapht")
}

if (!enable_shadow.toBoolean()) {
    shadowJar.enabled = false
}

compileJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
    dependsOn(tasks.named('exportMappings'))
    options.compilerArgs.add("-AreobfSrgFile=${mixinReobfSrgFile.get().asFile}")
}

compileTestJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    })
    testLogging {
        events TestLogEvent.STARTED, TestLogEvent.PASSED, TestLogEvent.FAILED
        exceptionFormat TestExceptionFormat.FULL
        showExceptions true
        showStackTraces true
        showCauses true
        showStandardStreams = show_testing_output.toBoolean()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                '1. Build'(Gradle) {
                    taskNames = ["build"]
                }
                '2. Run Client'(Gradle) {
                    taskNames = ["runClient"]
                }
                '3. Run Server'(Gradle) {
                    taskNames = ["runServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = '-encoding utf8'
                    moduleJavacAdditionalOptions = [
                            (project.name + '.main'): tasks.compileJava.options.compilerArgs.collect { "\"${it}\"" }.join(' ')
                    ]
                }
            }
            taskTriggers {
                beforeSync tasks.named("genSources")
            }
        }
    }
}

// Deployment
def final modrinthApiKey = providers.environmentVariable('MODRINTH_API_KEY')
def final cfApiKey = providers.environmentVariable('CURSEFORGE_API_KEY')
final boolean isCIEnv = providers.environmentVariable('CI').getOrElse('false').toBoolean()
final boolean deploymentDebug = providers.environmentVariable('DEPLOYMENT_DEBUG').getOrElse('false').toBoolean()

if (cfApiKey.isPresent() || deploymentDebug) {
    apply plugin: 'net.darkhax.curseforgegradle'
    //noinspection UnnecessaryQualifiedReference
    tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        disableVersionDetection()
        debugMode = deploymentDebug
        apiToken = cfApiKey.getOrElse('debug_token')

        doFirst {
            def mainFile = upload(curseForgeProjectId, tasks.named(remapTaskName).get().archiveFile.get())
            mainFile.displayName = versionDisplayFormat.replace('$MOD_NAME', mod_name).replace('$VERSION', mod_version)
            mainFile.releaseType = releaseType
            mainFile.changelogType = 'markdown'
            mainFile.addModLoader 'Forge'
            mainFile.addJavaVersion "Java 25"
            mainFile.addGameVersion minecraft_version
            if (serverEnvironment.toBoolean()) {
                mainFile.addEnvironment "Server"
            }
            if (clientEnvironment.toBoolean()) {
                mainFile.addEnvironment "Client"
            }

            if (curseForgeRelations.size() != 0) {
                String[] deps = curseForgeRelations.split(';')
                deps.each { dep ->
                    if (dep.size() == 0) {
                        return
                    }
                    String[] parts = dep.split(':')
                    String type = parts[0], slug = parts[1]
                    def types = [
                            'req'   : 'requiredDependency', 'required': 'requiredDependency',
                            'opt'   : 'optionalDependency', 'optional': 'optionalDependency',
                            'embed' : 'embeddedLibrary',    'embedded': 'embeddedLibrary',
                            'incomp': 'incompatible',       'fail'    : 'incompatible']
                    if (types.containsKey(type)) type = types[type]
                    mainFile.addRelation(slug, type)
                }
            }
        }
    }
    tasks.curseforge.dependsOn(build)
}

if (modrinthApiKey.isPresent() || deploymentDebug) {
    apply plugin: 'com.modrinth.minotaur'

    modrinth {
        token = modrinthApiKey.getOrElse('debug_token')
        projectId = modrinthProjectId
        versionName = versionDisplayFormat.replace('$MOD_NAME', mod_name).replace('$VERSION', mod_version)
        versionType = releaseType
        versionNumber = mod_version
        gameVersions = [minecraft_version]
        loaders = ["forge"]
        debugMode = deploymentDebug
        uploadFile = tasks.named(remapTaskName).get().archiveFile.get()
    }
    if (modrinthRelations.size() != 0) {
        String[] deps = modrinthRelations.split(';')
        deps.each { dep ->
            if (dep.size() == 0) {
                return
            }
            String[] parts = dep.split(':')
            String[] qual = parts[0].split('-')
            addModrinthDep(qual[0], qual.length > 1 ? qual[1] : 'project', parts[1])
        }
    }
    tasks.modrinth.dependsOn(build)
}

def addModrinthDep(String scope, String type, String name) {
    com.modrinth.minotaur.dependencies.Dependency dep
    def types = [
            'req'   : 'required',
            'opt'   : 'optional',
            'embed' : 'embedded',
            'incomp': 'incompatible', 'fail': 'incompatible']
    if (types.containsKey(scope)) scope = types[scope]
    types = ['proj': 'project', '': 'project', 'p': 'project', 'ver': 'version', 'v': 'version']
    if (types.containsKey(type)) type = types[type]
    switch (type) {
        case 'project':
            dep = new ModDependency(name, scope)
            break
        case 'version':
            dep = new VersionDependency(name, scope)
            break
        default:
            throw new Exception('Invalid modrinth dependency type: ' + type)
    }
    project.modrinth.dependencies.add(dep)
}

if (customMavenPublishUrl) {
    publishing {
        publications {
            create('maven', MavenPublication) {
                //noinspection GroovyAssignabilityCheck
                from components.java
                groupId = System.getenv('ARTIFACT_GROUP_ID') ?: mavenArtifactGroup
                artifactId = System.getenv('ARTIFACT_ID') ?: mod_id
                version = System.getenv('RELEASE_VERSION') ?: mod_version
            }
        }
        repositories {
            maven {
                url = customMavenPublishUrl
                allowInsecureProtocol = !customMavenPublishUrl.startsWith('https')
                credentials {
                    username = providers.environmentVariable('MAVEN_USER').getOrElse('NONE')
                    password = providers.environmentVariable('MAVEN_PASSWORD').getOrElse('NONE')
                }
            }
        }
    }
}

if (getFile('addon.gradle').exists()) {
    apply from: 'addon.gradle'
}

def getFile(String path) {
    return project.file(path)
}

def bannedModTransformDirs = [
    'remapped_curse/maven/gregtechceu-557242',
    'remapped_curse/maven/gregtech-ce-unofficial-557242',
    'remapped_curse/maven/codechicken-lib-1-8-242818',
    'remapped_curse/maven/industrial-craft-242638',
]
tasks.matching { it.name.startsWith('run') || it.name.startsWith('preRun') }.configureEach { t ->
    t.doFirst {
        def modTransformDir = project.file('.gradle/unimined/local/modTransform')
        bannedModTransformDirs.each { rel ->
            def dir = new File(modTransformDir, rel)
            if (dir.exists()) {
                logger.lifecycle("Deleting banned mod transform output: ${dir}")
                dir.deleteDir()
            }
        }
    }
}
